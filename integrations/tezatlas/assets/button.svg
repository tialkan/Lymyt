<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img"><title>Düğme · D2 → anlık buton → GND</title><rect width="1200" height="800" rx="20" fill="#fffdf8"/><g font-family="Arial,sans-serif" fill="#1d1a36"><text x="42" y="58" font-size="28" font-weight="700">Düğme · D2 → anlık buton → GND</text><rect x="60" y="180" width="260" height="220" rx="12" fill="#d5f2ee" stroke="#1d1a36" stroke-width="2"/><text x="190.0" y="210" text-anchor="middle" font-size="21" font-weight="700">NANO ESP32</text><rect x="570" y="160" width="400" height="320" rx="12" fill="#fff0c7" stroke="#1d1a36" stroke-width="2"/><text x="770.0" y="190" text-anchor="middle" font-size="21" font-weight="700">4 BACAKLI BUTON</text><text x="85" y="260" font-size="18">D2  INPUT_PULLUP</text><text x="85" y="330" font-size="18">GND</text><path d="M620 245 V380" stroke="#1d1a36" stroke-width="5"/><circle cx="620" cy="245" r="9" fill="#1d1a36"/><circle cx="620" cy="380" r="9" fill="#1d1a36"/><path d="M910 245 V380" stroke="#1d1a36" stroke-width="5"/><circle cx="910" cy="245" r="9" fill="#1d1a36"/><circle cx="910" cy="380" r="9" fill="#1d1a36"/><path d="M320 255 H470 V245 H620 M320 330 H420 V550 H1020 V380 H910" stroke="#3dbfb3" stroke-width="5" fill="none"/><text x="640" y="300" font-size="18">BASINCA BU İKİ GRUP</text><text x="670" y="330" font-size="18">BİRBİRİNE BAĞLANIR</text><text x="600" y="440" font-size="18">Aynı gruptaki iki bacak zaten bağlı.</text><text x="60" y="640" font-size="18">Butonu breadboardun orta yarığını köprüleyecek şekilde tak.</text><text x="60" y="680" font-size="18">Önce multimetreyle hangi bacakların zaten bağlı olduğunu bul.</text><text x="42" y="760" font-size="17">10×10 mm gövde açıklığı için uzatma başlığı / buton taşıyıcısı ayrıca ölçülmelidir.</text></g></svg>