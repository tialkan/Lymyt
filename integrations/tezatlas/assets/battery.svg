<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img"><title>AA pil seçeneği · önce kararlı 5V</title><rect width="1200" height="800" rx="20" fill="#fffdf8"/><g font-family="Arial,sans-serif" fill="#1d1a36"><text x="42" y="58" font-size="28" font-weight="700">AA pil seçeneği · önce kararlı 5V</text><rect x="50" y="200" width="230" height="130" rx="12" fill="#fff0c7" stroke="#1d1a36" stroke-width="2"/><text x="165.0" y="230" text-anchor="middle" font-size="21" font-weight="700">4× NiMH AA</text><rect x="350" y="200" width="230" height="130" rx="12" fill="#fde2e7" stroke="#1d1a36" stroke-width="2"/><text x="465.0" y="230" text-anchor="middle" font-size="21" font-weight="700">ANAHTAR</text><rect x="650" y="200" width="470" height="130" rx="12" fill="#d5f2ee" stroke="#1d1a36" stroke-width="2"/><text x="885.0" y="230" text-anchor="middle" font-size="21" font-weight="700">5V BUCK-BOOST + KESME</text><path d="M280 265 H350 M580 265 H650" stroke="#1d1a36" stroke-width="4"/><rect x="650" y="420" width="470" height="130" rx="12" fill="#e7e3f7" stroke="#1d1a36" stroke-width="2"/><text x="885.0" y="450" text-anchor="middle" font-size="21" font-weight="700">KARTIN USB GİRİŞİ</text><path d="M885 330 V420" stroke="#1d1a36" stroke-width="4"/><text x="60" y="450" font-size="20">1,2V × 4 = nominal 4,8V</text><text x="60" y="500" font-size="20">Haricî NiMH şarj cihazı</text><text x="60" y="590" font-size="19">Regülatör: yaklaşık 4–6V girişte sabit 5V; en az 1A sürekli çıkış.</text><text x="60" y="630" font-size="19">Pilleri VIN’e doğrudan bağlama. Kart pilleri şarj etmez.</text><text x="60" y="670" font-size="19">Önce multimetreyle çıkışı doğrula; USB güç kaynaklarını paralelleme.</text><text x="42" y="760" font-size="17">Regülatörün düşük gerilim kesmesi dört NiMH hücre için üretici sınırlarına göre ayarlanmalıdır.</text></g></svg>