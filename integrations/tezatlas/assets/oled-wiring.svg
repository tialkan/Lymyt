<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img"><title>OLED seçeneği · aynı adres, ayrı hat</title><rect width="1200" height="800" rx="20" fill="#fffdf8"/><g font-family="Arial,sans-serif" fill="#1d1a36"><text x="42" y="58" font-size="28" font-weight="700">OLED seçeneği · aynı adres, ayrı hat</text><rect x="60" y="140" width="320" height="260" rx="12" fill="#d5f2ee" stroke="#1d1a36" stroke-width="2"/><text x="220.0" y="170" text-anchor="middle" font-size="21" font-weight="700">NANO ESP32</text><rect x="680" y="140" width="420" height="180" rx="12" fill="#d5f2ee" stroke="#1d1a36" stroke-width="2"/><text x="890.0" y="170" text-anchor="middle" font-size="21" font-weight="700">SOL OLED / SSD1306</text><rect x="680" y="430" width="420" height="180" rx="12" fill="#d5f2ee" stroke="#1d1a36" stroke-width="2"/><text x="890.0" y="460" text-anchor="middle" font-size="21" font-weight="700">SAĞ OLED / SSD1306</text><text x="85" y="205" font-size="18">A4</text><path d="M350 200 H460 V205 H700" stroke="#3dbfb3" stroke-width="4" fill="none"/><text x="730" y="210" font-size="18">SDA (sol)</text><text x="85" y="250" font-size="18">A5</text><path d="M350 245 H495 V250 H700" stroke="#f0607f" stroke-width="4" fill="none"/><text x="730" y="255" font-size="18">SCL (sol)</text><text x="85" y="295" font-size="18">A2</text><path d="M350 290 H530 V495 H700" stroke="#3dbfb3" stroke-width="4" fill="none"/><text x="730" y="500" font-size="18">SDA (sağ)</text><text x="85" y="340" font-size="18">A3</text><path d="M350 335 H565 V540 H700" stroke="#f0607f" stroke-width="4" fill="none"/><text x="730" y="545" font-size="18">SCL (sağ)</text><rect x="60" y="485" width="470" height="170" rx="12" fill="#fff0c7" stroke="#1d1a36" stroke-width="2"/><text x="295.0" y="515" text-anchor="middle" font-size="21" font-weight="700">ORTAK BESLEME</text><text x="85" y="545" font-size="18">3V3 → iki ekranın VCC pini</text><text x="85" y="585" font-size="18">GND → iki ekranın GND pini</text><text x="680" y="670" font-size="18">Her iki OLED 0x3C: iki ayrı I²C hattı.</text><text x="42" y="760" font-size="17">Yalnız 4 pinli 128×64 SSD1306 I²C modülleri. SPI / SH1106 için bu çizimi kullanma.</text></g></svg>